lua_package_path "/usr/local/openresty/lualib/?.lua;;";
resolver 127.0.0.11 ipv6=off valid=10s;
error_log /dev/stderr notice;

upstream sf_normal_backend {
    server sf-normal:80;
}

upstream sf_gray_backend {
    server sf-gray:80;
}

server {
    listen 80;

    # Lua 会在 access 阶段把它改成 normal 或 gray。
    set $gray_route normal;
    set $gray_decision unset;

    add_header X-Gray-Route $gray_route always;
    add_header X-Gray-Decision $gray_decision always;

    # 同源测试页直接由这个模拟网关提供，避免浏览器跨域，方便观察真实响应头。
    location = /test {
        default_type text/html;
        add_header Cache-Control "no-store";
        alias /usr/local/openresty/html/gray-test.html;
    }

    location / {
        # 先查 Redis，再通过 ngx.exec 跳到对应的后端目标组。
        access_by_lua_file /etc/openresty/gray_router.lua;
    }

    location @normal {
        proxy_set_header Host $host;
        proxy_set_header X-Gray-Token $http_x_gray_token;
        proxy_set_header X-Gray-Route $gray_route;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://sf_normal_backend;
    }

    location @gray {
        proxy_set_header Host $host;
        proxy_set_header X-Gray-Token $http_x_gray_token;
        proxy_set_header X-Gray-Route $gray_route;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://sf_gray_backend;
    }
}
